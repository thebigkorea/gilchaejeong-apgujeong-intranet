<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>길채정 압구정점 일용직 근무내역</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f1ea;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;
  color:#24170f;
}

header{
  background:linear-gradient(135deg,#4a1207,#8b250b);
  color:#fff;
  padding:28px;
  border-radius:0 0 28px 28px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin-top:10px;
  opacity:.9;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:28px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
}

.field.full{
  grid-column:1 / -1;
}

label{
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  background:#fafafa;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  width:100%;
  border:none;
  border-radius:16px;
  padding:18px;
  background:#7c2d12;
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  margin-top:20px;
}

.notice{
  margin-top:18px;
  font-weight:700;
  color:#7c2d12;
}

@media(max-width:768px){

  .grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header>
  <h1>길채정 압구정점 일용직 근무내역</h1>
  <p>일용직 근무 및 지급내역을 저장합니다.</p>
</header>

<div class="container">

  <div class="card">

    <div class="grid">

      <div class="field">
        <label>근무일자</label>
        <input type="date" id="workDate">
      </div>

      <div class="field">
        <label>성명</label>
        <input type="text" id="name">
      </div>

      <div class="field">
        <label>휴대폰</label>
        <input type="text" id="phone">
      </div>

      <div class="field">
        <label>주민번호</label>
        <input type="text" id="rrn">
      </div>

      <div class="field">
        <label>근무구분</label>
        <select id="workType">
          <option>홀</option>
          <option>주방</option>
          <option>설거지</option>
          <option>기타</option>
        </select>
      </div>

      <div class="field">
        <label>시급</label>
        <input type="number" id="hourlyPay">
      </div>

      <div class="field">
        <label>출근시간</label>
        <input type="time" id="startTime">
      </div>

      <div class="field">
        <label>퇴근시간</label>
        <input type="time" id="endTime">
      </div>

      <div class="field">
        <label>근무시간</label>
        <input type="number" id="workHours">
      </div>

      <div class="field">
        <label>지급금액</label>
        <input type="number" id="payAmount">
      </div>

      <div class="field">
        <label>지급상태</label>
        <select id="payStatus">
          <option>미지급</option>
          <option>지급완료</option>
        </select>
      </div>

      <div class="field">
        <label>지급일자</label>
        <input type="date" id="payDate">
      </div>

      <div class="field full">
        <label>비고</label>
        <textarea id="memo"></textarea>
      </div>

    </div>

    <button onclick="saveDailyWorker()">
      일용직 저장
    </button>

    <div class="notice" id="notice"></div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzjJ4xzZl96Wi4AcYrfKrEzIl-gY5iEZCUEiZ_th51mD2Kq97G13z883QIMjFf99sQE3w/exec";

function val(id){
  return document.getElementById(id).value.trim();
}

async function saveDailyWorker(){

  const btn =
    document.querySelector("button");

  btn.disabled = true;
  btn.innerText = "저장중...";

  try{

    const payload = {

      action:"saveDailyWorker",
      store:"길채정 압구정점",

      workDate:val("workDate"),
      name:val("name"),
      phone:val("phone"),
      rrn:val("rrn"),
      workType:val("workType"),
      startTime:val("startTime"),
      endTime:val("endTime"),
      workHours:val("workHours"),
      hourlyPay:val("hourlyPay"),
      payAmount:val("payAmount"),
      payStatus:val("payStatus"),
      payDate:val("payDate"),
      memo:val("memo")

    };

    const res =
      await fetch(API_URL,{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(payload)
      });

    const data =
      await res.json();

    document.getElementById("notice")
      .innerText = data.message || "저장 완료";

  }catch(e){

    alert("저장 실패");

  }

  btn.disabled = false;
  btn.innerText = "일용직 저장";

}

</script>

</body>
</html>
